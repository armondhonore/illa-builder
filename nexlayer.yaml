application:
  name: illa-builder
  pods:
  - name: app
    image: mirror.gcr.io/illasoft/illa-builder:v4.8.5
    path: /
    servicePorts:
    - 2022
    volumes:
    - name: illa-data
      mountPath: /opt/illa/database
      size: 5Gi
  - name: postgres
    image: mirror.gcr.io/library/postgres:16-alpine
    servicePorts:
    - 5432
    vars:
      POSTGRES_DB: illa
      POSTGRES_USER: illa
      POSTGRES_PASSWORD: illa
    volumes:
    - name: illa-db
      mountPath: /var/lib/postgresql/data
      size: 5Gi

application:
  name: illa-builder
  pods:
  - name: app
    image: mirror.gcr.io/illacloud/illa-builder:latest
    path: /
    servicePorts:
    - 2022
    volumes:
    - name: illa-database
      mountPath: /opt/illa/database
      size: 5Gi
    - name: illa-drive
      mountPath: /opt/illa/drive
      size: 5Gi
